server:
  port: 8082

spring:
  application:
    name: ms-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true   # data.sql se ejecuta despues de crear el schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always
      continue-on-error: true   # idempotente: tolera reinicios sin re-fallar
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # MS-Auth tambien valida sus propios JWT para los endpoints /admin/**
          jwk-set-uri: http://localhost:8082/api/v1/auth/.well-known/jwks.json

jwt:
  # Asymmetric RS256 keys. In production load from a secrets manager (Vault, AWS SM).
  issuer: libro-clases-auth
  expiration-minutes: 60
  private-key-path: classpath:keys/private_key.pem
  public-key-path: classpath:keys/public_key.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      defaultCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

logging:
  level:
    root: INFO
    com.colegio.auth: DEBUG
