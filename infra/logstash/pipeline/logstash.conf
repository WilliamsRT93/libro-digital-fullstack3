# Pipeline de Logstash.
# Recibe logs JSON via TCP (desde Filebeat o directamente desde los microservicios),
# los enriquece, enmascara datos sensibles y los envia a Elasticsearch.

input {
  tcp {
    port => 5000
    codec => json_lines
  }
  beats {
    port => 5044
  }
}

filter {
  # Enmascara campos sensibles en caso de que algun servicio los registre por error.
  mutate {
    gsub => [
      "msg", "(?i)(password|passwd|secret|token)\\s*=\\s*\\S+", "\\1=***"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "libro-clases-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
