            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: pg-acad-secret, key: password } } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres-academico, namespace: libro-clases }
spec:
  selector: { app: postgres-academico }
  ports: [{ port: 5432, targetPort: 5432 }]
