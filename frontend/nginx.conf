# Configuracion de Nginx para servir el SPA y hacer proxy hacia el BFF.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Soporte de rutas SPA: si no existe el archivo, devuelve el index.html.
    location / {
        try_files $uri /index.html;
    }

    # Proxy de las llamadas /api/v1/bff/ hacia el contenedor del BFF.
    location /api/v1/bff/ {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
